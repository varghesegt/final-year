<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SmartFactory AI — Digital Twin</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths to the hash router route
      var segmentCount = 1;
      var loc = window.location;
      var path = loc.pathname.slice(1).split('/').slice(segmentCount).join('/');
      var query = loc.search ? loc.search : '';
      var hash = loc.hash ? loc.hash : '';
      var destination = loc.protocol + '//' + loc.host + '/final-year/#' + (path ? '/' + path : '') + query + hash;
      window.location.replace(destination);
    </script>
  </head>
  <body>
    <p>Redirecting to SmartFactory AI...</p>
  </body>
</html>
